[project]
name = "inventory-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "phonenumbers>=9.0.36",
    "psycopg2-binary>=2.9.12",
    "pydantic-extra-types>=2.11.1",
    "pydantic[email]>=2.13.4",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.52.1",
]

[tool.uv]
package = false

[tool.pyright]
reportIncompatibleVariableOverride = false
venvPath = "."
venv = ".venv"
